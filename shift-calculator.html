<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15141a" id="themeMeta">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حساب الشيفت">
<title>حاسبة حساب الشيفت</title>
<style>
  :root {
    --ink: #15141a;
    --paper: #1e1c23;
    --paper2: #26232c;
    --gold: #e2a53d;
    --indigo: #6f80f2;
    --green: #35c46a;
    --red: #ef5757;
    --text: #ece9e4;
    --muted: #8d8a93;
    --border: #322f39;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ink: #f4f2ee;
      --paper: #ffffff;
      --paper2: #ece9e4;
      --gold: #b3791c;
      --indigo: #4453d8;
      --green: #248a4d;
      --red: #d92d2d;
      --text: #1c1c1e;
      --muted: #8e8e93;
      --border: #d8d5cf;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    padding: 16px;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    display: flex;
    flex-direction: column;
    transition: background-color 0.3s ease, color 0.3s ease;
    -webkit-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  h1 {
    font-size: 1.15rem;
    margin: 4px 0 2px;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  h1 .mark { width: 4px; height: 16px; border-radius: 2px; background: var(--gold); display: inline-block; }
  p.sub { color: var(--muted); font-size: 0.82rem; margin: 0 0 14px; flex-shrink: 0; }

  .num { font-variant-numeric: tabular-nums; }

  .stats-row { display: flex; gap: 8px; margin-bottom: 8px; flex-shrink: 0; }
  .stat-card {
    flex: 1;
    background: var(--paper);
    border-radius: 14px;
    padding: 12px 6px;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    transition: background-color 0.3s ease;
  }
  .stat-val { font-size: 1.15rem; font-weight: 800; color: var(--text); }
  .stat-label { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
  .stat-card.clickable { cursor: pointer; border: none; font: inherit; color: inherit; width: 100%; transition: background-color 0.3s ease, box-shadow 0.2s ease; }
  .stat-card.clickable:hover { background: var(--paper2); }
  .stat-card.clickable:active { opacity: 0.85; }
  .stat-card.clickable .arrow { display: inline-block; font-size: 0.6rem; transition: transform 0.2s ease; }
  .stat-card.clickable.open { box-shadow: 0 0 0 1.5px var(--indigo), 0 1px 2px rgba(0,0,0,0.15); }
  .stat-card.clickable.open .arrow { transform: rotate(180deg); }

  .settlement-card {
    background: var(--paper);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
    margin-bottom: 14px;
    border: 1.5px solid transparent;
    border-top-color: rgba(255,255,255,0.05);
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    flex-shrink: 0;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  .settlement-card.owe { background: rgba(239,87,87,0.12); border-color: rgba(239,87,87,0.35); }
  .settlement-card.owed { background: rgba(53,196,106,0.12); border-color: rgba(53,196,106,0.35); }
  .settlement-card .amount { font-size: 1.6rem; font-weight: 800; transition: color 0.2s ease; }
  .settlement-card .amount.owe { color: var(--red); }
  .settlement-card .amount.owed { color: var(--green); }
  .settlement-card .label { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .settlement-card .avg-label { font-size: 0.72rem; color: var(--muted); margin-top: 4px; opacity: 0.85; }

  .form-card {
    background: var(--paper);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    border-top: 1px solid rgba(255,255,255,0.05);
    box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    flex-shrink: 0;
    transition: background-color 0.3s ease;
  }
  .form-title { font-size: 0.9rem; color: var(--muted); margin-bottom: 10px; }
  .hint { color: var(--muted); font-weight: normal; font-size: 0.75rem; }
  label { display: block; font-size: 0.78rem; color: var(--muted); margin: 8px 0 5px; }
  input[type=number] {
    width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--paper2); color: var(--text);
    font-size: 1rem; font-variant-numeric: tabular-nums;
    transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    -webkit-user-select: text;
    -ms-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  input:focus { outline: none; border-color: var(--indigo); }
  input.err { border-color: var(--red); }

  .add-btn {
    width: 100%; margin-top: 14px; padding: 13px; border: none; border-radius: 12px;
    background: var(--green); color: #062210; font-size: 1rem; font-weight: 700;
    cursor: pointer;
  }
  .add-btn:hover { filter: brightness(1.08); }
  .add-btn:active { opacity: 0.85; }
  .add-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .add-btn.warn { background: var(--gold); color: #3a2504; }

  .cancel-edit-btn {
    display: none;
    width: 100%; margin-top: 8px; padding: 10px; border-radius: 10px;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    font-size: 0.85rem; cursor: pointer;
  }
  .cancel-edit-btn.show { display: block; }
  .cancel-edit-btn:active { opacity: 0.8; }

  .field-error {
    color: var(--red); font-size: 0.8rem; margin-top: 8px; text-align: center;
    display: none;
  }
  .field-error.show { display: block; }

  .top-banner {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    z-index: 999;
    background: var(--paper2);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    opacity: 0;
    transform: translateY(-16px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    border: 2px solid transparent;
  }
  .top-banner.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .top-banner.cash { border-color: var(--gold); color: var(--gold); }
  .top-banner.visa { border-color: var(--indigo); color: var(--indigo); }
  .top-banner .icon { font-size: 1.5rem; }
  .top-banner #bannerUndo {
    background: rgba(255,255,255,0.15);
    border: none;
    color: inherit;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 800;
    flex-shrink: 0;
    cursor: pointer;
  }

  .action-row { display: flex; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
  .share-btn {
    flex: 1;
    background: rgba(111,128,242,0.14);
    border: 1.5px solid rgba(111,128,242,0.4);
    color: var(--indigo);
    border-radius: 12px;
    padding: 13px 8px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }
  .share-btn:hover { background: rgba(111,128,242,0.22); }
  .share-btn:active { opacity: 0.85; }
  .reset-btn {
    flex: 1;
    background: rgba(239,87,87,0.14);
    border: 1.5px solid rgba(239,87,87,0.4);
    color: var(--red);
    border-radius: 12px;
    padding: 13px 8px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }
  .reset-btn:hover { background: rgba(239,87,87,0.22); }
  .reset-btn.confirming { background: rgba(239,87,87,0.4); }
  .reset-btn:active { opacity: 0.85; }

  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 400; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  .orders-dropdown {
    position: fixed;
    left: 16px;
    right: 16px;
    z-index: 500;
    background: var(--paper);
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 16px 40px rgba(0,0,0,0.45);
    padding: 10px;
    opacity: 0;
    transform: translateY(-14px) scaleY(0.94);
    transform-origin: top center;
    pointer-events: none;
    transition: opacity 0.22s cubic-bezier(.2,.8,.2,1), transform 0.22s cubic-bezier(.2,.8,.2,1);
  }
  .orders-dropdown.open {
    opacity: 1;
    transform: translateY(0) scaleY(1);
    pointer-events: auto;
  }
  .orders-scroll {
    max-height: 52vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 2px;
  }
  .orders-scroll::-webkit-scrollbar { width: 4px; }
  .orders-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .order-item {
    background: var(--paper); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.05);
    transition: background-color 0.3s ease;
  }
  .order-item .icon-badge {
    font-size: 1.3rem; width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .order-item .icon-badge.cash { background: rgba(226,165,61,0.16); }
  .order-item .icon-badge.visa { background: rgba(111,128,242,0.16); }
  .order-item .details { flex: 1; margin-inline-start: 12px; margin-inline-end: 4px; }
  .order-item .details .nums { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
  .order-item .actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .order-item .edit { background: none; border: none; color: var(--indigo); font-size: 1rem; padding: 4px 8px; cursor: pointer; border-radius: 6px; }
  .order-item .edit:hover { background: rgba(111,128,242,0.12); }
  .order-item .del { background: none; border: none; color: var(--red); font-size: 1.1rem; padding: 4px 8px; cursor: pointer; border-radius: 6px; }
  .order-item .del:hover { background: rgba(239,87,87,0.12); }
  .empty { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 24px 0; }

  button:focus-visible, input:focus-visible, .stat-card.clickable:focus-visible {
    outline: 2px solid var(--indigo);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

  <div class="backdrop" id="backdrop" onclick="toggleList()"></div>

  <h1><span class="mark"></span>حاسبة حساب الشيفت</h1>
  <p class="sub">سجّل كل أوردر وشوف حسابك مع المطعم لحظة بلحظة</p>

  <div class="top-banner" id="topBanner" role="status" aria-live="polite">
    <span class="icon" id="bannerIcon"></span>
    <span id="bannerText"></span>
    <button id="bannerUndo" onclick="performUndo()" style="display:none;">تراجع</button>
  </div>

  <div class="stats-row">
    <button type="button" class="stat-card clickable" id="ordersCard" onclick="toggleList()" aria-expanded="false" aria-controls="ordersDropdown">
      <div class="stat-val num" id="orderCount">0</div>
      <div class="stat-label">أوردراتي <span class="arrow" id="ordersArrow" aria-hidden="true">▾</span></div>
    </button>
    <div class="stat-card">
      <div class="stat-val num" id="cashInHand">0</div>
      <div class="stat-label">الكاش معاك</div>
    </div>
    <div class="stat-card">
      <div class="stat-val num" id="totalProfit">0</div>
      <div class="stat-label">صافي ربحك</div>
    </div>
  </div>

  <div class="settlement-card" id="settlementCard">
    <div class="amount num" id="settlementAmount">0 ج</div>
    <div class="label" id="settlementLabel">مفيش حساب لسه</div>
    <div class="avg-label" id="avgLabel"></div>
  </div>

  <div class="form-card">
    <div class="form-title" id="formTitle">ضيف أوردر جديد</div>

    <label for="orderPrice">سعر الأوردر (ج) <span class="hint">— سيبها فاضية لو فيزا مدفوعة مقدماً</span></label>
    <input type="number" id="orderPrice" placeholder="" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-invalid="false" aria-describedby="fieldError">

    <label for="deliveryFee">رسوم التوصيل (ج)</label>
    <input type="number" id="deliveryFee" placeholder="" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-invalid="false" aria-describedby="fieldError">

    <button class="add-btn" id="addBtn" onclick="addOrder()" type="button">➕ ضيف الأوردر</button>
    <button class="cancel-edit-btn" id="cancelEditBtn" onclick="cancelEdit()" type="button">✕ إلغاء التعديل</button>
    <div class="field-error" id="fieldError" role="alert" aria-live="assertive">لازم تكتب رسوم التوصيل الأول</div>
  </div>

  <div class="action-row">
    <button class="share-btn" onclick="shareSummary()">📤 مشاركة الملخص</button>
    <button class="reset-btn" id="resetBtn" onclick="resetShift()">🔄 شيفت جديد</button>
  </div>

  <div class="orders-dropdown" id="ordersDropdown">
    <div class="orders-scroll">
      <div id="ordersList"><div class="empty">لسه معملتش ولا أوردر</div></div>
    </div>
  </div>

  <script>
    const MAX_ORDER_PRICE = 50000;
    const MAX_DELIVERY_FEE = 5000;

    let orders = [];
    let resetArmed = false;
    let addArmed = false;
    let toastTimer = null;
    let addArmedTimer = null;
    let undoData = null;
    let listOpen = false;
    let isSubmitting = false;
    let editingId = null;

    // ---- money & id helpers ----
    function roundMoney(n) {
      if (typeof n !== 'number' || !isFinite(n)) return 0;
      return Math.round((n + Number.EPSILON) * 100) / 100;
    }

    function sanitizeNumber(val, min, max, allowEmpty) {
      const trimmed = (val === null || val === undefined) ? '' : String(val).trim();
      if (trimmed === '') {
        return { status: allowEmpty ? 'empty' : 'invalid', value: 0 };
      }
      const n = Number(trimmed);
      if (isNaN(n) || !isFinite(n)) {
        return { status: 'invalid', value: 0 };
      }
      if (n < min) {
        return { status: 'below-min', value: n };
      }
      if (n > max) {
        return { status: 'above-max', value: n };
      }
      return { status: 'valid', value: roundMoney(n) };
    }

    function generateId() {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        try { return crypto.randomUUID(); } catch (e) {}
      }
      return Date.now().toString(36) + '-' + Math.random().toString(36).substring(2, 11);
    }

    function fmt(n) { return roundMoney(n).toLocaleString('ar-EG') + ' ج'; }

    function formatTime(iso) {
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      } catch (e) { return ''; }
    }

    // ---- persistence ----
    function saveOrders() {
      try {
        localStorage.setItem('shiftOrders', JSON.stringify(orders));
      } catch (e) {
        showBanner('⚠️', 'فشل الحفظ: الذاكرة ممتلئة', 'visa');
      }
    }

    function isOrderLogicallyValid(o) {
      if (!o || typeof o !== 'object') return false;
      if (o.type !== 'cash' && o.type !== 'visa') return false;
      if (typeof o.price !== 'number' || !isFinite(o.price)) return false;
      if (typeof o.fee !== 'number' || !isFinite(o.fee)) return false;
      if (o.type === 'cash') {
        if (!(o.price > 0) || o.price > MAX_ORDER_PRICE) return false;
      } else {
        if (o.price !== 0) return false;
      }
      if (!(o.fee > 0) || o.fee > MAX_DELIVERY_FEE) return false;
      return true;
    }

    function isValidStoredOrder(o) {
      if (!isOrderLogicallyValid(o)) return false;
      if (typeof o.id !== 'string' || o.id.trim() === '') return false;
      if (typeof o.time !== 'string') return false;
      const d = new Date(o.time);
      if (isNaN(d.getTime())) return false;
      return true;
    }

    function loadOrders() {
      try {
        const raw = localStorage.getItem('shiftOrders');
        if (!raw) { orders = []; return; }
        const parsed = JSON.parse(raw);
        let list = [];
        if (Array.isArray(parsed)) {
          list = parsed;
        } else if (parsed && Array.isArray(parsed.orders)) {
          list = parsed.orders;
        }
        orders = list.filter(isValidStoredOrder);
      } catch (e) { orders = []; }
    }

    // ---- shared calculation ----
    function calcShift() {
      const validOrders = orders.filter(isOrderLogicallyValid);
      const cashOrders = validOrders.filter(o => o.type === 'cash');
      const visaOrders = validOrders.filter(o => o.type === 'visa');
      const cashInHand = roundMoney(cashOrders.reduce((s, o) => s + o.price, 0));
      const totalProfit = roundMoney(validOrders.reduce((s, o) => s + o.fee, 0));
      const oweRestaurant = roundMoney(cashOrders.reduce((s, o) => s + (o.price - o.fee), 0));
      const owedByRestaurant = roundMoney(visaOrders.reduce((s, o) => s + o.fee, 0));
      const net = roundMoney(oweRestaurant - owedByRestaurant);
      return {
        cashCount: cashOrders.length, visaCount: visaOrders.length,
        cashInHand, totalProfit, net
      };
    }

    function toggleList() {
      listOpen = !listOpen;
      const dropdown = document.getElementById('ordersDropdown');
      const card = document.getElementById('ordersCard');
      const backdrop = document.getElementById('backdrop');

      if (listOpen) {
        const rect = card.getBoundingClientRect();
        dropdown.style.top = (rect.bottom + 8) + 'px';
      }

      dropdown.classList.toggle('open', listOpen);
      card.classList.toggle('open', listOpen);
      card.setAttribute('aria-expanded', listOpen ? 'true' : 'false');
      backdrop.classList.toggle('show', listOpen);
    }

    function isUnusual(price, fee) {
      const prevFees = orders.map(o => o.fee).filter(f => f > 0);
      const prevPrices = orders.filter(o => o.type === 'cash').map(o => o.price).filter(p => p > 0);
      const avgFee = prevFees.length >= 2 ? prevFees.reduce((a, b) => a + b, 0) / prevFees.length : null;
      const avgPrice = prevPrices.length >= 2 ? prevPrices.reduce((a, b) => a + b, 0) / prevPrices.length : null;
      const feeUnusual = avgFee && fee > avgFee * 3;
      const priceUnusual = avgPrice && price > avgPrice * 3;
      return feeUnusual || priceUnusual;
    }

    // ---- edit an existing order ----
    function startEdit(id) {
      const o = orders.find(x => x.id === id);
      if (!o) return;
      editingId = id;
      document.getElementById('orderPrice').value = o.type === 'cash' ? o.price : '';
      document.getElementById('deliveryFee').value = o.fee;
      document.getElementById('formTitle').textContent = 'تعديل الأوردر';
      document.getElementById('addBtn').textContent = '💾 حفظ التعديل';
      document.getElementById('cancelEditBtn').classList.add('show');
      document.getElementById('orderPrice').focus();
      if (listOpen) toggleList();
    }

    function cancelEdit() {
      editingId = null;
      document.getElementById('orderPrice').value = '';
      document.getElementById('deliveryFee').value = '';
      document.getElementById('formTitle').textContent = 'ضيف أوردر جديد';
      document.getElementById('addBtn').textContent = '➕ ضيف الأوردر';
      document.getElementById('cancelEditBtn').classList.remove('show');
    }

    function addOrder() {
      if (isSubmitting) return;

      const priceInput = document.getElementById('orderPrice');
      const feeInput = document.getElementById('deliveryFee');
      const errorEl = document.getElementById('fieldError');
      const addBtn = document.getElementById('addBtn');

      priceInput.classList.remove('err');
      feeInput.classList.remove('err');
      priceInput.setAttribute('aria-invalid', 'false');
      feeInput.setAttribute('aria-invalid', 'false');
      errorEl.classList.remove('show');

      function showFieldError(inputEl, msg) {
        inputEl.classList.add('err');
        inputEl.setAttribute('aria-invalid', 'true');
        errorEl.textContent = msg;
        errorEl.classList.add('show');
      }

      const priceResult = sanitizeNumber(priceInput.value, 0.01, MAX_ORDER_PRICE, true);
      const feeResult = sanitizeNumber(feeInput.value, 0.01, MAX_DELIVERY_FEE, false);

      if (feeResult.status === 'invalid') {
        showFieldError(feeInput, feeInput.value.trim() === '' ? 'لازم تكتب رسوم التوصيل الأول' : 'أدخل رقماً صحيحاً لرسوم التوصيل');
        return;
      }
      if (feeResult.status === 'below-min') {
        showFieldError(feeInput, 'رسوم التوصيل لازم تكون أكبر من صفر');
        return;
      }
      if (feeResult.status === 'above-max') {
        showFieldError(feeInput, 'رسوم التوصيل أكبر من الحد المسموح (' + MAX_DELIVERY_FEE.toLocaleString('ar-EG') + ' ج)');
        return;
      }

      let type;
      if (priceResult.status === 'empty') {
        type = 'visa';
      } else if (priceResult.status === 'valid') {
        type = 'cash';
      } else if (priceResult.status === 'invalid') {
        showFieldError(priceInput, 'سعر الأوردر غير صالح، أدخل رقماً صحيحاً');
        return;
      } else if (priceResult.status === 'below-min') {
        showFieldError(priceInput, 'سعر الأوردر لازم يكون أكبر من صفر');
        return;
      } else {
        showFieldError(priceInput, 'سعر الأوردر أكبر من الحد المسموح (' + MAX_ORDER_PRICE.toLocaleString('ar-EG') + ' ج)');
        return;
      }

      const price = type === 'cash' ? priceResult.value : 0;
      const fee = feeResult.value;

      if (!editingId && !addArmed && isUnusual(price, fee)) {
        addArmed = true;
        addBtn.textContent = '⚠️ رقم غير معتاد، تأكيد الإضافة؟';
        addBtn.classList.add('warn');
        clearTimeout(addArmedTimer);
        addArmedTimer = setTimeout(() => {
          addArmed = false;
          addBtn.textContent = '➕ ضيف الأوردر';
          addBtn.classList.remove('warn');
        }, 3000);
        return;
      }
      addArmed = false;
      clearTimeout(addArmedTimer);
      addBtn.classList.remove('warn');

      isSubmitting = true;
      addBtn.disabled = true;

      if (editingId) {
        const idx = orders.findIndex(o => o.id === editingId);
        if (idx !== -1) {
          const oldOrder = orders[idx];
          orders[idx] = { ...oldOrder, type, price, fee };
          undoData = { type: 'edit', id: editingId, old: oldOrder };
          showBanner('✏️', 'اتعدّل الأوردر', 'cash', true);
        }
        cancelEdit();
      } else {
        orders.push({ type, price, fee, id: generateId(), time: new Date().toISOString() });
        showConfirm(type);
        if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
      }

      priceInput.value = '';
      feeInput.value = '';
      priceInput.focus();

      saveOrders();
      render();

      setTimeout(() => {
        isSubmitting = false;
        addBtn.disabled = false;
      }, 400);
    }

    function showBanner(icon, text, style, showUndo) {
      const banner = document.getElementById('topBanner');
      const iconEl = document.getElementById('bannerIcon');
      const textEl = document.getElementById('bannerText');
      const undoBtn = document.getElementById('bannerUndo');

      banner.classList.remove('cash', 'visa');
      banner.classList.add(style);
      iconEl.textContent = icon;
      textEl.textContent = text;
      undoBtn.style.display = showUndo ? 'inline-block' : 'none';

      banner.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.remove('show');
        if (showUndo) undoData = null;
      }, showUndo ? 4000 : 1600);
    }

    function performUndo() {
      if (!undoData) return;
      if (undoData.type === 'order') {
        orders.splice(undoData.index, 0, undoData.order);
      } else if (undoData.type === 'shift') {
        orders = undoData.orders;
      } else if (undoData.type === 'edit') {
        const idx = orders.findIndex(o => o.id === undoData.id);
        if (idx !== -1) orders[idx] = undoData.old;
      }
      undoData = null;
      clearTimeout(toastTimer);
      document.getElementById('topBanner').classList.remove('show');
      saveOrders();
      render();
    }

    function showConfirm(type) {
      if (type === 'cash') showBanner('💵', 'اتسجل كأوردر كاش', 'cash', false);
      else showBanner('💳', 'اتسجل كأوردر فيزا', 'visa', false);
    }

    function confirmDelete(btn, id) {
      if (btn.dataset.armed === 'true') {
        removeOrder(id);
        return;
      }
      btn.dataset.armed = 'true';
      btn.textContent = 'أكّد الحذف؟';
      btn.style.fontSize = '0.75rem';
      setTimeout(() => {
        if (btn.dataset.armed === 'true') {
          btn.dataset.armed = 'false';
          btn.textContent = '✕';
          btn.style.fontSize = '';
        }
      }, 2500);
    }

    function removeOrder(id) {
      const idx = orders.findIndex(o => o.id === id);
      if (idx === -1) return;
      const removed = orders[idx];
      orders = orders.filter(o => o.id !== id);
      if (editingId === id) cancelEdit();
      saveOrders();
      render();
      undoData = { type: 'order', order: removed, index: idx };
      showBanner('🗑️', 'اتمسح الأوردر', 'visa', true);
      if (navigator.vibrate) { try { navigator.vibrate([50, 30, 50]); } catch (e) {} }
    }

    function resetShift() {
      const btn = document.getElementById('resetBtn');
      if (!orders.length) return;
      if (!resetArmed) {
        resetArmed = true;
        btn.textContent = '⚠️ تأكيد المسح؟';
        btn.classList.add('confirming');
        setTimeout(() => {
          resetArmed = false;
          btn.textContent = '🔄 شيفت جديد';
          btn.classList.remove('confirming');
        }, 3000);
        return;
      }
      const backup = orders.slice();
      orders = [];
      resetArmed = false;
      btn.textContent = '🔄 شيفت جديد';
      btn.classList.remove('confirming');
      if (editingId) cancelEdit();
      saveOrders();
      render();
      undoData = { type: 'shift', orders: backup };
      showBanner('🗑️', 'اتمسح الشيفت كله', 'visa', true);
    }

    // ---- share / copy summary ----
    function buildSummary() {
      const c = calcShift();
      let status;
      if (c.net > 0) status = 'المفروض تدي المطعم: ' + fmt(c.net);
      else if (c.net < 0) status = 'المطعم المفروض يديك: ' + fmt(Math.abs(c.net));
      else status = 'الحساب مضبوط بالظبط';

      return '📊 ملخص الشيفت\n' +
        'عدد الأوردرات: ' + orders.length + ' (كاش: ' + c.cashCount + ' · فيزا: ' + c.visaCount + ')\n' +
        'الكاش معاك: ' + fmt(c.cashInHand) + '\n' +
        'صافي ربحك: ' + fmt(c.totalProfit) + '\n' +
        'النتيجة: ' + status;
    }

    async function shareSummary() {
      if (!orders.length) {
        showBanner('⚠️', 'مفيش أوردرات للمشاركة', 'visa');
        return;
      }
      const text = buildSummary();
      if (navigator.share) {
        try {
          await navigator.share({ title: 'ملخص الشيفت', text: text });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }
      await copyToClipboard(text);
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showBanner('📋', 'تم نسخ الملخص', 'cash');
      } catch (e) {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        const ok = document.execCommand('copy');
        showBanner(ok ? '📋' : '⚠️', ok ? 'تم نسخ الملخص' : 'فشل النسخ', ok ? 'cash' : 'visa');
      } catch (err) {
        showBanner('⚠️', 'فشل النسخ', 'visa');
      }
      document.body.removeChild(ta);
    }

    // ---- DOM-based render (no innerHTML, safe against tampered localStorage by construction) ----
    function render() {
      const listContainer = document.getElementById('ordersList');
      while (listContainer.firstChild) listContainer.removeChild(listContainer.firstChild);

      if (orders.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'empty';
        emptyDiv.textContent = 'لسه معملتش ولا أوردر';
        listContainer.appendChild(emptyDiv);
      } else {
        orders.slice().reverse().forEach(function(o) {
          const safeType = o.type === 'cash' ? 'cash' : 'visa';
          const timeStr = formatTime(o.time);

          const item = document.createElement('div');
          item.className = 'order-item';

          const badge = document.createElement('span');
          badge.className = 'icon-badge ' + safeType;
          badge.textContent = safeType === 'cash' ? '💵' : '💳';
          item.appendChild(badge);

          const details = document.createElement('div');
          details.className = 'details';
          const nums = document.createElement('div');
          nums.className = 'nums num';
          let numsText = '';
          if (safeType === 'cash') numsText += 'أوردر شامل: ' + fmt(o.price) + ' \u00a0·\u00a0 ';
          numsText += 'توصيل: ' + fmt(o.fee);
          if (timeStr) numsText += ' \u00a0·\u00a0 ' + timeStr;
          nums.textContent = numsText;
          details.appendChild(nums);
          item.appendChild(details);

          const actions = document.createElement('div');
          actions.className = 'actions';

          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'edit';
          editBtn.textContent = '✎';
          editBtn.setAttribute('aria-label', 'تعديل الأوردر');
          editBtn.addEventListener('click', function() { startEdit(o.id); });
          actions.appendChild(editBtn);

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'del';
          delBtn.textContent = '✕';
          delBtn.setAttribute('aria-label', 'حذف الأوردر');
          delBtn.addEventListener('click', function() { confirmDelete(delBtn, o.id); });
          actions.appendChild(delBtn);

          item.appendChild(actions);
          listContainer.appendChild(item);
        });
      }

      const c = calcShift();

      document.getElementById('orderCount').textContent = orders.length;
      document.getElementById('cashInHand').textContent = fmt(c.cashInHand);
      document.getElementById('totalProfit').textContent = fmt(c.totalProfit);

      const avgEl = document.getElementById('avgLabel');
      avgEl.textContent = orders.length
        ? 'متوسط الربح: ' + fmt(roundMoney(c.totalProfit / orders.length)) + ' / أوردر'
        : '';

      const cardEl = document.getElementById('settlementCard');
      const amountEl = document.getElementById('settlementAmount');
      const labelEl = document.getElementById('settlementLabel');

      if (orders.length === 0) {
        amountEl.textContent = '0 ج';
        amountEl.className = 'amount num';
        cardEl.className = 'settlement-card';
        labelEl.textContent = 'مفيش حساب لسه';
      } else if (c.net > 0) {
        amountEl.textContent = fmt(c.net);
        amountEl.className = 'amount num owe';
        cardEl.className = 'settlement-card owe';
        labelEl.textContent = 'المفروض تدي المطعم';
      } else if (c.net < 0) {
        amountEl.textContent = fmt(Math.abs(c.net));
        amountEl.className = 'amount num owed';
        cardEl.className = 'settlement-card owed';
        labelEl.textContent = 'المطعم المفروض يديك';
      } else {
        amountEl.textContent = '0 ج';
        amountEl.className = 'amount num';
        cardEl.className = 'settlement-card';
        labelEl.textContent = 'الحساب مضبوط بالظبط';
      }
    }

    // ---- block e/+/- while typing (prevents "1e5"-style exponent tricks) ----
    function sanitizeTypedInput(e) {
      e.target.value = e.target.value.replace(/[eE+\-]/g, '');
    }
    document.getElementById('orderPrice').addEventListener('input', sanitizeTypedInput);
    document.getElementById('deliveryFee').addEventListener('input', sanitizeTypedInput);

    document.getElementById('orderPrice').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('deliveryFee').focus(); }
    });
    document.getElementById('deliveryFee').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); addOrder(); }
    });

    // ---- close dropdown on rotate/resize so it doesn't end up mispositioned ----
    window.addEventListener('resize', function() { if (listOpen) toggleList(); });
    window.addEventListener('orientationchange', function() { if (listOpen) toggleList(); });

    // ---- dynamic theme-color meta to match light/dark mode ----
    function updateThemeColor() {
      const meta = document.getElementById('themeMeta');
      const isLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      meta.content = isLight ? '#f4f2ee' : '#15141a';
    }
    updateThemeColor();
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', updateThemeColor);

    loadOrders();
    render();
  </script>
</body>
